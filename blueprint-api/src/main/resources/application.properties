# Server configuration
server.port=8080
spring.application.name=blueprint-api

# R2DBC (Reactive, non-blocking PostgreSQL driver)
# r2dbc: prefix indicates reactive driver (not JDBC)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/blueprint
spring.r2dbc.username=blueprint_user
spring.r2dbc.password=${DB_PASSWORD:changeme}
# Connection pool tuning: enough for concurrent requests without overhead
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.validation-query=SELECT 1

# JDBC for Flyway (Flyway needs blocking driver for migrations)
# Flyway runs migrations before app startup, so blocking is acceptable
spring.datasource.url=jdbc:postgresql://localhost:5432/blueprint
spring.datasource.username=blueprint_user
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: Auto-migrate on startup
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging: Detailed for debugging, quieter in production
logging.level.root=INFO
logging.level.com.blueprint=DEBUG
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n

# Google Gemini API: Free tier (60 req/min), used for AI explanations
google.gemini.api-key=${GOOGLE_GEMINI_API_KEY:your-api-key}
google.gemini.model=gemini-1.5-pro
google.gemini.max-tokens=1024