# Server configuration
server.port=8081
spring.application.name=blueprint-agent

# R2DBC (Reactive PostgreSQL)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/blueprint
spring.r2dbc.username=blueprint_user
spring.r2dbc.password=${DB_PASSWORD:changeme}
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.validation-query=SELECT 1

# JDBC for Flyway (runs at startup)
spring.datasource.url=jdbc:postgresql://localhost:5432/blueprint
spring.datasource.username=blueprint_user
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: Auto-migrate
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.root=INFO
logging.level.com.blueprint=DEBUG
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n

# Google Gemini API: Used for generating design explanations
google.gemini.api-key=${GOOGLE_GEMINI_API_KEY:your-api-key}
google.gemini.model=gemini-1.5-pro
google.gemini.max-tokens=1024

# Agent configuration
# git-repo-path: Where agent writes generated code and commits
# blueprint-api-url: Agent calls API to store results (avoids direct DB access)
agent.git-repo-path=${AGENT_GIT_REPO_PATH:/tmp/blueprint-systems}
agent.blueprint-api-url=http://localhost:8080