version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: blueprint-postgres
    environment:
      POSTGRES_DB: blueprint
      POSTGRES_USER: blueprint_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - blueprint_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blueprint_user -d blueprint"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  blueprint_db: